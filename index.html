<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Método de Riqueza Generacional</title>

<style>
/* BASE */
body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; /* Fuente más moderna tipo landing */
    background: #0a0a0a;
    color: #FFFFFF;
}

/* CONTENEDOR */
.container {
    max-width: 900px;
    margin: auto;
    padding: 40px 20px;
    text-align: center;
}

/* ORO ALFA VIP (TEXTO) */
.gold-text {
    background: linear-gradient(
        to bottom,
        #f5e39d 0%, 
        #b8964d 45%, 
        #91712a 100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* TITULO */
h1 {
    font-size: 42px;
    line-height: 1.1;
    margin-bottom: 10px;
}

/* SUB */
.sub {
    color: #FFFFFF;
    font-size: 18px;
    margin-top: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 300;
}

/* VIDEO */
.video {
    margin: 40px 0;
}

.video iframe {
    width: 100%;
    height: 400px;
    border-radius: 4px;
    border: 1px solid #b8964d;
}

/* BOTON DORADO VIP */
.cta button {
    background: linear-gradient(
        180deg,
        #f5e39d 0%, 
        #d6b35f 30%,
        #b8964d 50%, 
        #91712a 100%
    );
    border: none;
    padding: 22px;
    width: 100%;
    max-width: 450px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    border-radius: 4px;
    color: #000;
    text-transform: uppercase;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.cta button:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
    box-shadow: 0 6px 20px rgba(184, 150, 77, 0.4);
}

/* STATS */
.stats {
    display: flex;
    justify-content: space-around;
    margin-top: 40px;
    border-top: 1px solid rgba(184, 150, 77, 0.3);
    border-bottom: 1px solid rgba(184, 150, 77, 0.3);
    padding: 25px 0;
}

.stat h2 {
    color: #b8964d;
    margin: 0;
}

/* BENEFICIOS */
.benefits {
    margin-top: 50px;
    text-align: left;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
}

.benefits h3 {
    color: #f5e39d;
    text-transform: uppercase;
}

.benefits p {
    color: #cccccc;
    border-bottom: 1px solid #222;
    padding-bottom: 10px;
}

/* TESTIMONIOS */
.testimonial {
    background: #111;
    padding: 25px;
    margin-top: 20px;
    border-radius: 4px;
    border-left: 4px solid #b8964d;
    font-style: italic;
}

/* PRECIO */
.price {
    margin-top: 60px;
}

.old {
    text-decoration: line-through;
    color: #666;
    font-size: 20px;
}

.new {
    font-size: 50px;
    margin-top: 10px;
}

/* RESPONSIVE */
@media(max-width:600px){
    h1 { font-size: 30px; }
    .stats { flex-direction: column; gap: 25px; }
}
</style>
</head>

<body>

<div class="container">

<h1 class="gold-text">CÓDIGO ALFA VIP</h1>
<p class="sub">EL MANIFIESTO DEL 1%: NO COMPITAS, LIDERA</p>

<div class="video">
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
</div>

<div class="cta">
    <button>ACCEDER GRATIS AHORA</button>
</div>

<div class="stats">
    <div class="stat">
        <h2>2900+</h2>
        <p>Líderes</p>
    </div>
    <div class="stat">
        <h2>23+</h2>
        <p>Módulos</p>
    </div>
    <div class="stat">
        <h2>4.9★</h2>
        <p>Éxito</p>
    </div>
</div>

<div class="benefits">
    <h3>Dominio Total:</h3>
    <p>✔ Control absoluto de tus finanzas</p>
    <p>✔ Psicología de alto rendimiento</p>
    <p>✔ Estrategias de inversión silenciosas</p>
</div>

<div class="price">
    <p class="old">ANTES $97</p>
    <p class="new gold-text">HOY GRATIS</p>
</div>

<div class="cta" style="margin-top: 30px;">
    <button>DESCARGAR MANIFIESTO</button>
</div>

</div>

</body>
</html>
