<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CÓDIGO ALFA VIP | El Manifiesto del 1%</title>
    <style>
        :root {
            --gold-light: #f5e39d;
            --gold-mid: #b8964d;
            --gold-dark: #91712a;
            --bg-black: #050505;
            --card-bg: #0f0f0f;
        }

        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-black);
            color: #ffffff;
            line-height: 1.5;
        }

        .gold-text {
            background: linear-gradient(to bottom, var(--gold-light) 0%, var(--gold-mid) 45%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-transform: uppercase;
        }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        /* BOX OFERTA LANZAMIENTO */
        .offer-box {
            border: 1px solid var(--gold-mid);
            padding: 40px 20px;
            margin: 40px 0;
            background: #000;
            text-align: center;
            position: relative;
        }

        .offer-box::before {
            content: "";
            position: absolute;
            top: 5px; left: 5px; right: 5px; bottom: 5px;
            border: 1px solid rgba(184, 150, 77, 0.2);
            pointer-events: none;
        }

        .label-lanzamiento {
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.75rem;
            color: #fff;
            margin-bottom: 15px;
            display: block;
        }

        .price-main {
            font-size: 3rem;
            margin: 10px 0 30px 0;
            font-weight: 400;
        }

        /* CONTADOR REAL */
        .countdown-wrap {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 35px;
        }

        .time-unit {
            background: #111;
            border: 1px solid #222;
            width: 70px;
            padding: 15px 0;
        }

        .time-unit span {
            display: block;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--gold-mid);
        }

        .time-unit label {
            font-size: 0.6rem;
            text-transform: uppercase;
            color: #555;
            letter-spacing: 1px;
        }

        /* BOTÓN ADQUIRIR */
        .btn-alfa {
            width: 100%;
            max-width: 400px;
            padding: 22px;
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold-mid) 45%, var(--gold-dark) 100%);
            border: none;
            color: #000;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 1.1rem;
            letter-spacing: 1px;
            border-radius: 2px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .footer-cta {
            font-size: 0.75rem;
            color: #444;
            margin-top: 15px;
        }

    </style>
</head>
<body>

<div class="container">
    
    <div class="offer-box">
        <span class="label-lanzamiento">Oferta de Lanzamiento</span>
        <h1 class="price-main gold-text">TODO POR $27</h1>

        <div class="countdown-wrap">
            <div class="time-unit">
                <span id="days">00</span>
                <label>Día</label>
            </div>
            <div class="time-unit">
                <span id="hours">00</span>
                <label>Hrs</label>
            </div>
            <div class="time-unit">
                <span id="minutes">00</span>
                <label>Min</label>
            </div>
            <div class="time-unit">
                <span id="seconds">00</span>
                <label>Seg</label>
            </div>
        </div>

        <button class="btn-alfa">ADQUIRIR PROTOCOLO VIP</button>
        <p class="footer-cta">Garantía de 7 días • 100% Calificaciones Positivas</p>
    </div>

</div>

<script>
    // CONFIGURACIÓN: Pon aquí la fecha en que termina la oferta
    // Formato: "Month Day, Year HH:MM:SS"
    const targetDate = new Date("May 10, 2026 23:59:59").getTime();

    const timer = setInterval(function() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        // Cálculos de tiempo
        const d = Math.floor(distance / (1000 * 60 * 60 * 24));
        const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((distance % (1000 * 60)) / 1000);

        // Inyectar en el HTML (añadiendo un "0" si es menor a 10)
        document.getElementById("days").innerText = d < 10 ? "0" + d : d;
        document.getElementById("hours").innerText = h < 10 ? "0" + h : h;
        document.getElementById("minutes").innerText = m < 10 ? "0" + m : m;
        document.getElementById("seconds").innerText = s < 10 ? "0" + s : s;

        // Si el tiempo termina
        if (distance < 0) {
            clearInterval(timer);
            document.querySelector(".countdown-wrap").innerHTML = "<p style='color:red;'>OFERTA EXPIRADA</p>";
        }
    }, 1000); // Se ejecuta cada 1 segundo
</script>

</body>
</html>
