<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CÓDIGO ALFA VIP | El Manifiesto del 1%</title>
    <style>
        :root {
            /* EL DORADO REAL DE TU IMAGEN */
            --gold-bright: #fceabb; /* El brillo máximo */
            --gold-main: #f8b500;   /* El tono medio vibrante */
            --gold-deep: #bb8613;   /* La sombra metálica */
            --gold-shadow: #5d4106; /* El tono más oscuro del relieve */
            --bg-black: #050505;
        }

        body {
            margin: 0;
            font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-black);
            color: #ffffff;
            text-align: center;
        }

        /* EFECTO METALIZADO DE ALTO CONTRASTE */
        .gold-text {
            background: linear-gradient(
                to bottom, 
                #fceabb 0%, 
                #f8b500 25%, 
                #bb8613 50%, 
                #fceabb 75%, 
                #5d4106 100%
            );
            background-size: 100% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            text-transform: uppercase;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5));
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* MOCKUP CON SOMBRA INTEGRADA */
        .hero-mockup { margin: 40px 0; }
        .hero-mockup img { 
            width: 100%; 
            max-width: 450px; 
            filter: drop-shadow(0 10px 30px rgba(187, 134, 19, 0.3));
            border-radius: 4px;
        }

        /* BOTÓN CON EFECTO ORO PULIDO */
        .btn-alfa {
            width: 100%;
            padding: 22px;
            background: linear-gradient(
                180deg, 
                #fceabb 0%, 
                #f8b500 40%, 
                #bb8613 60%, 
                #5d4106 100%
            );
            border: none;
            color: #000;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            font-size: 1.1rem;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: 0.3s;
        }

        .btn-alfa:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 20px rgba(248, 181, 0, 0.4);
        }

        /* CONTADOR ESTILO VIP */
        .countdown-wrap { display: flex; justify-content: center; gap: 10px; margin: 25px 0; }
        .time-unit { 
            background: #111; 
            border: 1px solid #2a2a2a; 
            width: 70px; 
            padding: 15px 0; 
            box-shadow: inset 0 0 10px rgba(187, 134, 19, 0.1);
        }
        .time-unit span { 
            display: block; 
            font-size: 1.8rem; 
            font-weight: bold; 
            color: var(--gold-main); 
        }
        .time-unit label { font-size: 0.6rem; color: #555; text-transform: uppercase; }

        .product-card {
            background: #0f0f0f;
            border: 1px solid #1a1a1a;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-left: 4px solid var(--gold-main);
            text-align: left;
        }

        footer { padding: 40px 0; font-size: 0.8rem; color: #333; }
    </style>
</head>
<body>

<div class="container">
    <header style="padding: 20px 0;">
        <h1 class="gold-text" style="font-size: 3rem; margin: 0;">CÓDIGO ALFA VIP</h1>
        <p style="color: #666; letter-spacing: 3px; font-size: 0.7rem;">NO COMPITAS, LIDERA</p>
    </header>

    <div class="hero-mockup">
        <img src="92A77E8D-8FCC-443D-B6FA-72F166413416.png" alt="Código Alfa VIP">
    </div>

    <div style="border: 1px solid #1a1a1a; padding: 30px; background: #000; margin-bottom: 40px;">
        <h2 style="font-weight: 300; font-size: 1.2rem; margin-bottom: 25px;">DESCARGA EL MANIFIESTO GRATIS</h2>
        <input type="text" placeholder="Tu Nombre" style="width:100%; padding:15px; margin-bottom:10px; background:#111; border:1px solid #333; color:#fff;">
        <input type="email" placeholder="Tu Email" style="width:100%; padding:15px; margin-bottom:20px; background:#111; border:1px solid #333; color:#fff;">
        <button class="btn-alfa">ACCEDER AHORA</button>
    </div>

    <div class="offer-final" style="border: 1px solid var(--gold-deep); padding: 40px 20px;">
        <span style="font-size: 0.7rem; letter-spacing: 2px;">OFERTA DE LANZAMIENTO</span>
        <h2 class="gold-text" style="font-size: 3rem; margin: 10px 0;">TODO POR $27</h2>

        <div class="countdown-wrap">
            <div class="time-unit"><span id="days">01</span><label>Días</label></div>
            <div class="time-unit"><span id="hours">08</span><label>Hrs</label></div>
            <div class="time-unit"><span id="minutes">45</span><label>Min</label></div>
            <div class="time-unit"><span id="seconds">12</span><label>Seg</label></div>
        </div>

        <button class="btn-alfa">COMPRAR PAQUETE VIP</button>
    </div>

    <footer>CÓDIGO ALFA VIP © 2026</footer>
</div>

<script>
    const countDate = new Date().getTime() + (2 * 24 * 60 * 60 * 1000); 
    function update() {
        const now = new Date().getTime();
        const gap = countDate - now;
        const d = Math.floor(gap / (1000 * 60 * 60 * 24));
        const h = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((gap % (1000 * 60)) / 1000);
        document.getElementById('days').innerText = d < 10 ? '0'+d : d;
        document.getElementById('hours').innerText = h < 10 ? '0'+h : h;
        document.getElementById('minutes').innerText = m < 10 ? '0'+m : m;
        document.getElementById('seconds').innerText = s < 10 ? '0'+s : s;
    }
    setInterval(update, 1000);
    update();
</script>

</body>
</html>
