<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código Alfa VIP | El Manifiesto del 1%</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Oro Líquido Profundo */
            --liquid-gold: linear-gradient(135deg, #a67c00 0%, #ffbf00 50%, #b8860b 100%);
            --gold-glow: rgba(212, 175, 55, 0.2);
            --dark-bg: #050505;
        }

        body {
            background-color: var(--dark-bg);
            color: #f4f4f4;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            padding: 60px 24px;
            text-align: center;
        }

        /* Título con Fuente Premium Serif */
        h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 3.2rem;
            margin-bottom: 0;
            background: var(--liquid-gold);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            line-height: 1;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-top: 15px;
            margin-bottom: 50px;
        }

        /* Caja de captura optimizada para conversión */
        .optin-box {
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            padding: 40px 30px;
            border-radius: 2px; /* Bordes rectos para mayor seriedad */
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            margin-bottom: 60px;
        }

        .optin-box p {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 20px;
            margin-bottom: 12px;
            background: #111;
            border: 1px solid #222;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #b8860b;
        }

        /* Botón de Oro Líquido con efecto de lujo */
        .btn-gold {
            width: 100%;
            padding: 22px;
            background: var(--liquid-gold);
            border: none;
            color: #000;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .btn-gold:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px var(--gold-glow);
            filter: brightness(1.1);
        }

        /* Card de Venta VIP */
        .sales-card {
            border-top: 1px solid #1a1a1a;
            padding-top: 50px;
            margin-top: 20px;
        }

        .sales-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .features {
            text-align: left;
            list-style: none;
            padding: 0;
            margin: 30px 0;
        }

        .features li {
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            font-size: 0.95rem;
