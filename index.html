<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CÓDIGO ALFA VIP | El Manifiesto del 1%</title>

<style>
:root {
    --gold-light: #f5e39d;
    --gold-mid: #b8964d;
    --gold-dark: #91712a;
    --bg-black: #0a0a0a;
    --card-bg: #111111;
}

body {
    margin: 0;
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: var(--bg-black);
    color: #FFFFFF;
}

/* TEXTO ORO */
.gold-text {
    background: linear-gradient(120deg,#fff8dc,#f0c040,#d4a017,#f8e27a,#c9a84c,#8b6914);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
    text-transform: uppercase;
}

/* CONTENEDOR */
.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

/* HEADER */
header {
    text-align: center;
    padding: 30px 0;
    border-bottom: 1px solid rgba(184,150,77,0.1);
}

/* MOCKUP */
.hero-mockup {
    position: relative;
    text-align: center;
    margin: 40px 0;
}

.hero-mockup img {
    width: 420px;
    max-width: 100%;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.8));
}

.hero-mockup::after {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    background: radial-gradient(circle, rgba(212,160,23,0.25), transparent);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    filter: blur(70px);
    z-index: -1;
}

/* CAPTURE */
.capture-box {
    border: 1px solid rgba(184,150,77,0.4);
    padding: 30px;
    margin: 40px 0;
    background: linear-gradient(180deg,#111,#050505);
}

input {
    width: 100%;
    padding: 15px;
    margin-bottom: 15px;
    background: #151515;
    border: 1px solid #333;
    color: white;
}

/* PRODUCTOS */
.product-card {
    background: var(--card-bg);
    border: 1px solid #222;
    padding: 20px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 20px;
    border-left: 3px solid var(--gold-mid);
}

/* OFERTA */
.offer-final {
    border: 1px solid var(--gold-mid);
    padding: 40px 20px;
    margin: 60px 0;
    background: #000;
    text-align: center;
}

/* BOTÓN */
.btn-alfa {
    width: 100%;
    padding: 22px;
    background: linear-gradient(180deg,#F0C040,#8B6914);
    border: none;
    color: #000;
    font-weight: 900;
    cursor: pointer;
}

/* COUNTDOWN */
.countdown-wrap {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 25px 0;
}

.time-unit {
    background: #111;
    border: 1px solid #222;
    width: 70px;
    padding: 15px 0;
}

.time-unit span {
    display: block;
    font-size: 1.8rem;
    color: var(--gold-mid);
}

/* TESTIMONIO */
.testimonial {
    border-bottom: 1px solid #222;
    padding: 40px 0;
}

footer {
    text-align: center;
    padding: 40px 0;
    color: #444;
}

</style>
</head>

<body>

<div class="container">

<header>
    <h1 class="gold-text">CÓDIGO ALFA VIP</h1>
    <p>EL MANIFIESTO DEL 1%: NO COMPITAS, LIDERA</p>
</header>

<!-- MOCKUP -->
<div class="hero-mockup">
    <img src="mockup-libro.png" alt="Código Alfa VIP">
</div>

<!-- CAPTURA -->
<div class="capture-box">
    <h2>DESCARGA EL MANIFIESTO GRATIS</h2>
    <input type="text" placeholder="Tu Nombre">
    <input type="email" placeholder="Tu Email">
    <button class="btn-alfa">ACCEDER GRATIS</button>
</div>

<!-- PRODUCTOS -->
<div class="product-card">
    <div>🦅</div>
    <div>
        <h4 class="gold-text">Leyes del Dinero</h4>
        <p>Reglas del 1%</p>
    </div>
</div>

<!-- OFERTA -->
<div class="offer-final">
    <h2 class="gold-text">TODO POR $27</h2>

    <div class="countdown-wrap">
        <div class="time-unit"><span id="days">00</span></div>
        <div class="time-unit"><span id="hours">00</span></div>
        <div class="time-unit"><span id="minutes">00</span></div>
        <div class="time-unit"><span id="seconds">00</span></div>
    </div>

    <button class="btn-alfa">COMPRAR AHORA</button>
</div>

<!-- TESTIMONIO -->
<div class="testimonial">
    ⭐⭐⭐⭐⭐
    <p>"Esto cambió todo."</p>
</div>

<footer>
    CÓDIGO ALFA VIP © 2026
</footer>

</div>

<script>
const countDate = new Date();
countDate.setDate(countDate.getDate() + 2);

function updateCountdown() {
    const now = new Date().getTime();
    const gap = countDate - now;

    const d = Math.floor(gap / (1000*60*60*24));
    const h = Math.floor((gap % (1000*60*60*24)) / (1000*60*60));
    const m = Math.floor((gap % (1000*60*60)) / (1000*60));
    const s = Math.floor((gap % (1000*60)) / 1000);

    document.getElementById('days').innerText = d;
    document.getElementById('hours').innerText = h;
    document.getElementById('minutes').innerText = m;
    document.getElementById('seconds').innerText = s;
}

setInterval(updateCountdown, 1000);
</script>

</body>
</html>
