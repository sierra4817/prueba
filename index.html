<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CÓDIGO ALFA VIP | El Manifiesto del 1%</title>

<style>
:root {
    --gold-light: #f5e39d;
    --gold-mid: #b8964d;
    --gold-dark: #91712a;
    --bg-black: #050505;
    --card-bg: #0f0f0f;
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: var(--bg-black);
    color: #FFFFFF;
    line-height: 1.6;
}

.gold-text {
    background: linear-gradient(to bottom, #f5e39d 0%, #b8964d 45%, #91712a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 900;
    text-transform: uppercase;
}

.container {
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

header {
    text-align: center;
    padding: 40px 0;
}

/* MOCKUP CONTAINER */
.hero-mockup {
    text-align: center;
    margin: 20px 0 40px 0;
    perspective: 1000px;
}

.hero-mockup img {
    width: 100%;
    max-width: 450px;
    filter: drop-shadow(0 20px 50px rgba(184, 150, 77, 0.2));
    border-radius: 4px;
    animation: floating 3s ease-in-out infinite;
}

@keyframes floating {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
    100% { transform: translateY(0px); }
}

.capture-box {
    border: 1px solid rgba(184,150,77,0.3);
    padding: 30px;
    background: #000;
    text-align: center;
}

input {
    width: 100%;
    padding: 15px;
    margin-bottom: 10px;
    background: #111;
    border: 1px solid #333;
    color: #fff;
    box-sizing: border-box;
}

.btn-alfa {
    width: 100%;
    padding: 20px;
    background: linear-gradient(180deg, #f5e39d 0%, #b8964d 50%, #91712a 100%);
    border: none;
    font-weight: 900;
    cursor: pointer;
    text-transform: uppercase;
}

.offer-final {
    border: 1px solid var(--gold-mid);
    padding: 40px 20px;
    margin-top: 50px;
    text-align: center;
}

.countdown-wrap {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
}

.time-unit {
    background: #111;
    width: 65px;
    padding: 10px 0;
    border: 1px solid #222;
}

.time-unit span { display: block; font-size: 1.5rem; color: var(--gold-mid); font-weight: bold;}
.time-unit label { font-size: 0.6rem; color: #555; text-transform: uppercase;}

footer { text-align: center; padding: 40px; color: #444; font-size: 0.8rem; }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="gold-text">CÓDIGO ALFA VIP</h1>
        <p style="letter-spacing: 2px; font-size: 0.7rem; color: #888;">EL MANIFIESTO DEL 1%</p>
    </header>

    <div class="hero-mockup">
        <img src="https://i.ibb.co/v4m6p6p/mockup-alfa.png" onerror="this.src='https://via.placeholder.com/450x550/000000/b8964d?text=CODIGO+ALFA+VIP'" alt="Libro Código Alfa">
    </div>

    <div class="capture-box">
        <h2 style="font-weight: 300; font-size: 1.1rem; margin-bottom: 20px;">DESCARGA EL MANIFIESTO GRATIS</h2>
        <input type="text" placeholder="Tu Nombre">
        <input type="email" placeholder="Tu Email">
        <button class="btn-alfa">ACCEDER AHORA</button>
    </div>

    <div class="offer-final">
        <span style="font-size: 0.7rem; letter-spacing: 2px;">OFERTA DE LANZAMIENTO</span>
        <h2 class="gold-text" style="font-size: 2.5rem; margin: 10px 0;">TODO POR $27</h2>
        
        <div class="countdown-wrap">
            <div class="time-unit"><span id="days">00</span><label>Días</label></div>
            <div class="time-unit"><span id="hours">00</span><label>Hrs</label></div>
            <div class="time-unit"><span id="minutes">00</span><label>Min</label></div>
            <div class="time-unit"><span id="seconds">00</span><label>Seg</label></div>
        </div>

        <button class="btn-alfa">OBTENER PAQUETE</button>
    </div>

    <footer>CÓDIGO ALFA VIP © 2026</footer>
</div>

<script>
    const countDate = new Date().getTime() + (2 * 24 * 60 * 60 * 1000); 

    function updateCountdown() {
        const now = new Date().getTime();
        const gap = countDate - now;

        const d = Math.floor(gap / (1000 * 60 * 60 * 24));
        const h = Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((gap % (1000 * 60)) / 1000);

        document.getElementById('days').innerText = d < 10 ? '0'+d : d;
        document.getElementById('hours').innerText = h < 10 ? '0'+h : h;
        document.getElementById('minutes').innerText = m < 10 ? '0'+m : m;
        document.getElementById('seconds').innerText = s < 10 ? '0'+s : s;
    }
    setInterval(updateCountdown, 1000);
    updateCountdown();
</script>
</body>
</html>
